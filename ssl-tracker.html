<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cert Camel</title>
<!-- Drawn inline as a data URI: no second request, no /favicon.ico 404 against
     the local server. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23d99b3f'%3E%3Crect x='6' y='14' width='16' height='8' rx='4'/%3E%3Ccircle cx='11' cy='13' r='4'/%3E%3Ccircle cx='17.5' cy='13' r='4'/%3E%3Cpath d='M19 18 L21.5 8 L24.5 8.5 L22.5 18 Z'/%3E%3Ccircle cx='24' cy='7.5' r='3.2'/%3E%3Crect x='25.5' y='6.4' width='4.5' height='2.6' rx='1.3'/%3E%3Crect x='8' y='21' width='2.6' height='7' rx='1.3'/%3E%3Crect x='12' y='21' width='2.6' height='7' rx='1.3'/%3E%3Crect x='16' y='21' width='2.6' height='7' rx='1.3'/%3E%3Crect x='19.4' y='21' width='2.6' height='7' rx='1.3'/%3E%3C/g%3E%3C/svg%3E">
<script>
// Applied before the stylesheet paints, so a saved dark choice does not flash
// white on the way in. Kept deliberately tiny and dependency-free.
(function(){
  try {
    var t = localStorage.getItem('certcamel-theme');
    if (t === 'dark' || t === 'light') { document.documentElement.setAttribute('data-theme', t); }
    if (localStorage.getItem('certcamel-sidebar-collapsed') === '1') {
      document.documentElement.setAttribute('data-sidebar-precollapse', '1');
    }
  } catch (e) { /* storage unavailable; falls back to defaults */ }
})();
</script>
<link rel="stylesheet" href="assets/app.css">
<style>
/* Avoids a one-frame flash of an expanded sidebar before app.js applies the
   saved collapsed state on DOMContentLoaded. */
html[data-sidebar-precollapse] .sidebar{width:var(--sidebar-w-collapsed); flex-basis:var(--sidebar-w-collapsed);}
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Main">
    <div class="brand">
      <span class="mark">
        <img src="assets/logo.png" alt="" width="317" height="174">
      </span>
      <h1>Cert Camel</h1>
    </div>

    <div class="navgroup">
      <a class="navitem" href="#/home" data-view="home">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>
        <span class="navlabel">Home</span>
        <span class="navbadge hidden" id="nav-badge-home"></span>
      </a>
      <a class="navitem" href="#/certificates" data-view="certificates">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9V6a5 5 0 0 1 10 0v3"/></svg></span>
        <span class="navlabel">Certificates</span>
        <span class="navbadge hidden" id="nav-badge-certificates"></span>
      </a>
    </div>

    <div class="navgroup navgroup-divided">
      <a class="navitem" href="#/logs" data-view="logs">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>
        <span class="navlabel">Logs</span>
      </a>
      <a class="navitem" href="#/docs" data-view="docs">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
        <span class="navlabel">Docs</span>
      </a>
    </div>

    <!-- Settings last: it is where you go to change how the tool works, not
         where you go day to day. The pages above are the daily ones. -->
    <div class="navgroup navgroup-divided" id="navgroup-settings">
      <button class="navgroup-label navgroup-toggle" type="button" id="btn-settings-group"
              aria-expanded="true" aria-controls="settings-navitems">
        <span>Settings</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="navgroup-items" id="settings-navitems">
      <a class="navitem" href="#/settings/general" data-view="settings" data-sub="general">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .33 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.33 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.33-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg></span>
        <span class="navlabel">General</span>
      </a>
      <a class="navitem" href="#/settings/authorities" data-view="settings" data-sub="authorities">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/></svg></span>
        <span class="navlabel">Certificate Authorities</span>
      </a>
      <a class="navitem" href="#/settings/dns" data-view="settings" data-sub="dns">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg></span>
        <span class="navlabel">DNS Automation</span>
      </a>
      <a class="navitem" href="#/settings/deployments" data-view="settings" data-sub="deployments">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="7" rx="1.5"/><rect x="2" y="14" width="20" height="7" rx="1.5"/><circle cx="7" cy="6.5" r="1"/><circle cx="7" cy="17.5" r="1"/></svg></span>
        <span class="navlabel">Certificate Deployments</span>
      </a>
      <a class="navitem" href="#/settings/alerts" data-view="settings" data-sub="alerts">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
        <span class="navlabel">Alerts</span>
      </a>
      </div>
    </div>

    <div class="sidebar-foot">
      <label class="theme-picker">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></span>
        <span class="navlabel">Theme</span>
        <select id="theme-select" aria-label="Colour theme"></select>
      </label>
      <button class="navitem" type="button" id="btn-sidebar-toggle" title="Collapse sidebar">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></span>
        <span class="navlabel">Collapse</span>
      </button>
    </div>
  </nav>

  <div class="content">
    <div class="contentwrap">

      <section id="jobpanel" class="hidden">
        <h2 id="jobtitle">Working<span class="rule"></span></h2>
        <pre class="log" id="joblog"></pre>
      </section>

      <div id="view-home" class="view hidden"></div>
      <div id="view-certificates" class="view hidden"></div>
      <div id="view-settings" class="view hidden"></div>
      <div id="view-logs" class="view hidden"></div>
      <div id="view-docs" class="view hidden"></div>

    </div>
  </div>
</div>

<!-- One dialog, three jobs: assign a certificate's load balancers, choose where a
     renewal pushes, or choose where a deployment goes. window.confirm cannot
     hold checkboxes, and separate dialogs for these would drift apart. -->
<div class="modal hidden" id="picker">
  <div class="modal-card narrow" role="dialog" aria-modal="true" aria-labelledby="picktitle">
    <h3 id="picktitle">Deploy to</h3>
    <p class="mini" id="pick-sub"></p>
    <div id="pick-certs"></div>
    <div id="pick-targets"></div>
    <p class="status-line" id="pick-status"></p>
    <div class="modal-actions">
      <button class="btn" type="button" id="pick-cancel">Cancel</button>
      <button class="btn primary" type="button" id="pick-ok">Continue</button>
    </div>
  </div>
</div>

<span class="mini hidden" id="livehint"></span>

<script src="ssl-data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/views/home.js"></script>
<script src="assets/views/certificates.js"></script>
<script src="assets/views/settings.js"></script>
<script src="assets/views/logs.js"></script>
<script src="assets/views/docs.js"></script>
</body>
</html>
