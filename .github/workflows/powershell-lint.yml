# PSScriptAnalyzer, because CodeQL cannot read PowerShell.
#
# CodeQL has no PowerShell analyser at all, so the language this project is
# mostly written in - the server, the credential store, the ACME client - is
# invisible to it. This is what looks at that part, and it publishes to the same
# Security tab so both halves of the codebase are reviewed in one place.
#
# Nothing here is continue-on-error, deliberately.
#
# The first version of this file marked the analysis step continue-on-error so
# that findings could not turn the build red. Findings never could:
# Invoke-ScriptAnalyzer returns them, it does not throw. What the flag actually
# hid was the analysis itself failing - a bad -Path argument - and the job
# reported success having produced nothing at all. That is the same shape as the
# bug this repository spent a week removing from the update panel: a check that
# could not run must never look like a check that passed.
#
# So: a broken analysis fails loudly, and findings are simply reported.

name: PowerShell lint

on:
  push:
    branches: [main]
    paths: ['**.ps1', '.github/workflows/powershell-lint.yml']
  pull_request:
    paths: ['**.ps1', '.github/workflows/powershell-lint.yml']
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Invoke-ScriptAnalyzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # Already present on the hosted runner. Installing over a loaded module
          # only produces a "currently in use" warning and changes nothing, so
          # ask first and print what is actually going to run.
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          }
          $v = (Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Host "PSScriptAnalyzer $v"

      - name: Analyse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # -Path takes ONE path and walks it with -Recurse. Handing it an array
          # of file paths throws "Cannot convert 'System.Object[]' to the type
          # 'System.String'", which is how the first run of this workflow managed
          # to analyse nothing while reporting success.
          $scripts = @(Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1,*.psd1)
          Write-Host "Analysing $($scripts.Count) script(s)"
          if ($scripts.Count -eq 0) { throw 'No PowerShell files found - the checkout or the filter is wrong.' }

          # Settings file rather than -Severity here: it carries the rule
          # exclusions and the reasoning for each one, which does not fit on a
          # command line and should not be invisible to somebody reading a run.
          $found = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings .github/PSScriptAnalyzerSettings.psd1)
          Write-Host "$($found.Count) finding(s)"

          # Grouped, so the common rules are visible at a glance on the run page
          # rather than as a wall of individual lines.
          $summary = "## PSScriptAnalyzer`n`n$($scripts.Count) script(s) analysed.`n`n"
          if (-not $found) {
              $summary += "No findings.`n"
          } else {
              $summary += "| Rule | Severity | Count |`n|---|---|---|`n"
              foreach ($g in ($found | Group-Object RuleName | Sort-Object Count -Descending)) {
                  $summary += "| $($g.Name) | $(($g.Group | Select-Object -First 1).Severity) | $($g.Count) |`n"
              }
              $summary += "`n**$($found.Count) finding(s).** Detail in the Security tab under Code scanning.`n"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          # Hand-built SARIF rather than a third-party action, so the only thing
          # this workflow trusts is GitHub's own upload step.
          $levels = @{ 'Error' = 'error'; 'Warning' = 'warning'; 'Information' = 'note' }
          $root = (Get-Location).Path

          $rules = @($found | Select-Object -ExpandProperty RuleName -Unique | ForEach-Object {
              @{ id = $_; shortDescription = @{ text = $_ }
                 helpUri = "https://learn.microsoft.com/powershell/utility-modules/psscriptanalyzer/rules/$_" }
          })

          $results = @($found | ForEach-Object {
              $rel = [string]$_.ScriptPath
              if ($rel -and $rel.StartsWith($root)) { $rel = $rel.Substring($root.Length) }
              $rel = ($rel -replace '\\', '/').TrimStart('/')
              @{
                  ruleId  = $_.RuleName
                  level   = $(if ($levels.ContainsKey([string]$_.Severity)) { $levels[[string]$_.Severity] } else { 'warning' })
                  message = @{ text = [string]$_.Message }
                  locations = @(@{ physicalLocation = @{
                      artifactLocation = @{ uri = $rel }
                      # Line 0 is not valid SARIF, and one bad region rejects the
                      # entire upload rather than the single result.
                      region = @{ startLine = [Math]::Max(1, [int]$_.Line) }
                  } })
              }
          })

          $sarif = @{
              '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
              version   = '2.1.0'
              runs      = @(@{
                  tool = @{ driver = @{
                      name = 'PSScriptAnalyzer'
                      informationUri = 'https://github.com/PowerShell/PSScriptAnalyzer'
                      rules = $rules
                  } }
                  results = $results
              })
          }

          # -Depth 10: the default of 2 silently truncates the nested location
          # objects to the string "System.Collections.Hashtable".
          $sarif | ConvertTo-Json -Depth 10 | Out-File -FilePath psscriptanalyzer.sarif -Encoding utf8

          # Prove the file is there and parses before handing it to the uploader,
          # so a malformed SARIF is reported here rather than as a confusing
          # failure inside somebody else's action.
          if (-not (Test-Path psscriptanalyzer.sarif)) { throw 'SARIF file was not written.' }
          $check = Get-Content psscriptanalyzer.sarif -Raw | ConvertFrom-Json
          Write-Host "SARIF ok: $($check.runs[0].results.Count) result(s), $($check.runs[0].tool.driver.rules.Count) rule(s)"

      - name: Publish to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: psscriptanalyzer.sarif
          category: psscriptanalyzer
